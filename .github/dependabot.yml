version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # One PR for routine patch/minor bumps instead of dozens of individual
      # ones — security-relevant majors still get their own PR for real
      # review, not silently grouped away.
      routine-updates:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'
