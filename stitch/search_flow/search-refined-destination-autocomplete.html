<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Vaya - Destination Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#006c49",
                        "inverse-primary": "#bec6e0",
                        "on-tertiary-container": "#3980f4",
                        "on-background": "#0b1c30",
                        "primary-fixed-dim": "#bec6e0",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "secondary-container": "#6cf8bb",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-tint": "#565e74",
                        "primary-container": "#131b2e",
                        "surface-container": "#e5eeff",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-primary-container": "#7c839b",
                        "surface-container-high": "#dce9ff",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#002113",
                        "on-primary-fixed": "#131b2e",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed-variant": "#005236",
                        "primary-fixed": "#dae2fd",
                        "on-tertiary-fixed": "#001a42",
                        "background": "#f8f9ff",
                        "outline": "#76777d",
                        "surface-variant": "#d3e4fe",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-container-low": "#eff4ff",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-error-container": "#93000a",
                        "surface-dim": "#cbdbf5",
                        "on-error": "#ffffff",
                        "tertiary-container": "#001a42",
                        "tertiary-fixed-dim": "#adc6ff",
                        "outline-variant": "#c6c6cd",
                        "on-surface-variant": "#45464d",
                        "inverse-on-surface": "#eaf1ff",
                        "primary": "#000000",
                        "tertiary": "#000000",
                        "inverse-surface": "#213145",
                        "on-tertiary-fixed-variant": "#004395"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-main": "20px",
                        "gutter-grid": "16px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "touch-target": "48px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }]

                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background h-full font-sans antialiased flex flex-col relative overflow-y-auto">
<!-- Top App Bar -->
<header class="sticky top-0 w-full z-50 bg-background px-margin-main py-stack-md flex items-center justify-between">
<button class="w-touch-target h-touch-target flex items-center justify-center bg-surface-container-lowest rounded-full shadow-sm shadow-primary/10 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-[24px]" aria-hidden="true">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Où allez-vous ?</h1>
<div class="w-touch-target h-touch-target"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col px-margin-main pb-safe gap-stack-lg pt-stack-sm">
<!-- Search Input -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 transform -translate-y-1/2 text-on-surface-variant font-headline-sm text-headline-sm" data-icon="search">search</span>
<input class="w-full pl-12 pr-4 py-touch-target rounded-xl bg-surface-container-lowest border border-outline-variant focus:border-on-background focus:ring-1 focus:ring-on-background font-body-md text-body-md text-on-background placeholder:text-on-surface-variant outline-none transition-colors h-[56px] shadow-sm shadow-primary/5" placeholder="Rechercher une destination" type="text">
</div>
<!-- Lieux enregistrés -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Lieux enregistrés</h2>
<div class="grid grid-cols-2 gap-3 mt-1">
<button class="flex items-center gap-3 p-3 bg-surface-container-lowest rounded-xl border border-outline-variant/30 hover:bg-surface-container transition-colors active:scale-95 text-left shadow-sm shadow-primary/5">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-background text-[20px]" aria-hidden="true">work</span>
</div>
<div class="flex flex-col overflow-hidden">
<span class="font-body-sm text-body-sm text-on-background font-medium truncate">Travail</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Les Berges du Lac</span>
</div>
</button>
<button class="flex items-center gap-3 p-3 bg-surface-container-lowest rounded-xl border border-outline-variant/30 hover:bg-surface-container transition-colors active:scale-95 text-left shadow-sm shadow-primary/5">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-background text-[20px]" aria-hidden="true">home</span>
</div>
<div class="flex flex-col overflow-hidden">
<span class="font-body-sm text-body-sm text-on-background font-medium truncate">Domicile</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">La Marsa</span>
</div>
</button>
</div>
</section>
<!-- Suggestions -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider mt-2">Récent &amp; Suggéré</h2>
<div class="flex flex-col gap-2 mt-1">
<!-- Address 1 -->
<button class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/30 hover:bg-surface-container transition-colors active:scale-[0.98] text-left shadow-sm shadow-primary/5">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" aria-hidden="true">flight</span>
</div>
<div class="flex flex-col flex-grow overflow-hidden border-b border-outline-variant/20 pb-1">
<span class="font-body-md text-body-md text-on-background font-medium truncate">Aéroport de Tunis-Carthage</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Tunis</span>
</div>
</button>
<!-- Address 2 -->
<button class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/30 hover:bg-surface-container transition-colors active:scale-[0.98] text-left shadow-sm shadow-primary/5">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" aria-hidden="true">location_on</span>
</div>
<div class="flex flex-col flex-grow overflow-hidden border-b border-outline-variant/20 pb-1">
<span class="font-body-md text-body-md text-on-background font-medium truncate">Sidi Bou Saïd</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Banlieue Nord, Tunis</span>
</div>
</button>
<!-- Address 3 -->
<button class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl border border-outline-variant/30 hover:bg-surface-container transition-colors active:scale-[0.98] text-left shadow-sm shadow-primary/5">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" aria-hidden="true">history</span>
</div>
<div class="flex flex-col flex-grow overflow-hidden border-b border-outline-variant/20 pb-1 border-transparent">
<span class="font-body-md text-body-md text-on-background font-medium truncate">Avenue Habib Bourguiba</span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Centre-ville, Tunis</span>
</div>
</button>
</div>
</section>
</main>


</body></html>
