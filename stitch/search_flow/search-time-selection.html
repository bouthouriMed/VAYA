<!-- Simple JS for the tactile picker interaction simulation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const hourPicker = document.getElementById('hour-picker');
            const minutePicker = document.getElementById('minute-picker');
            const display = document.getElementById('selected-time-display');

            // Scroll to center initial values
            setTimeout(() => {
                hourPicker.scrollTop = 128; // approx to center 18
                minutePicker.scrollTop = 192; // approx to center 30
            }, 100);

            function updateActiveState(container) {
                const items = container.querySelectorAll('.picker-item');
                const containerCenter = container.scrollTop + (container.clientHeight / 2);

                let closestItem = null;
                let minDistance = Infinity;

                items.forEach(item => {
                    const itemCenter = item.offsetTop + (item.clientHeight / 2);
                    const distance = Math.abs(containerCenter - itemCenter);
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestItem = item;
                    }
                    
                    // Reset styles
                    item.classList.remove('text-primary', 'font-headline-md', 'font-bold', 'active-item');
                    item.classList.add('text-outline-variant', 'font-headline-sm');
                });

                if (closestItem) {
                    closestItem.classList.remove('text-outline-variant', 'font-headline-sm');
                    closestItem.classList.add('text-primary', 'font-headline-md', 'font-bold', 'active-item');
                }
                
                updateDisplay();
            }

            function updateDisplay() {
                const activeHour = document.querySelector('#hour-picker .active-item')?.dataset.value || '18';
                const activeMinute = document.querySelector('#minute-picker .active-item')?.dataset.value || '30';
                display.textContent = `${activeHour}:${activeMinute}`;
            }

            hourPicker.addEventListener('scroll', () => {
                clearTimeout(hourPicker.scrollTimeout);
                hourPicker.scrollTimeout = setTimeout(() => updateActiveState(hourPicker), 50);
            });

            minutePicker.addEventListener('scroll', () => {
                clearTimeout(minutePicker.scrollTimeout);
                minutePicker.scrollTimeout = setTimeout(() => updateActiveState(minutePicker), 50);
            });
        });
    </script>
