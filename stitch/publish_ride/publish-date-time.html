<body class="bg-background antialiased flex flex-col min-h-screen relative overflow-x-hidden">
<!-- Progress Indicator -->
<div class="fixed top-0 left-0 w-full h-[3px] bg-surface-variant z-[60]">
<div class="h-full bg-primary w-1/3 rounded-r-full transition-all duration-500 ease-out"></div>
</div>
<!-- Top App Bar (Modified for transactional flow) -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm shadow-primary/10 flex items-center justify-between px-margin-main h-touch-target mt-[3px]">
<button aria-label="Go back" class="h-touch-target w-touch-target flex items-center justify-start text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-sm text-headline-sm font-bold text-primary">When are you leaving?</span>
<div class="w-touch-target"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-[calc(48px+3px)] pb-[100px] px-margin-main flex flex-col gap-stack-lg max-w-md mx-auto w-full mt-stack-md">
<!-- Route Summary (Bento-style card) -->
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_24px_rgba(0,0,0,0.03)] border border-surface-variant flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Your Route</h2>
<div class="flex items-center gap-3">
<div class="flex flex-col items-center gap-1">
<div class="w-2.5 h-2.5 rounded-full border-2 border-primary"></div>
<div class="w-0.5 h-6 bg-outline-variant rounded-full"></div>
<div class="w-1.5 h-1.5 rounded-full bg-primary/40"></div>
<div class="w-0.5 h-6 bg-outline-variant rounded-full"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
<div class="flex flex-col justify-between h-[84px] py-0.5">
<span class="font-body-md text-body-md text-on-surface">Tunis</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Hammamet</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Nabeul</span>
</div>
</div>
</section>

<h2 class="font-headline-sm text-headline-sm text-primary">Select Date</h2>
<div class="flex gap-3 overflow-x-auto pb-2 snap-x snap-mandatory">
<!-- Today -->

<span class="font-label-md text-label-md text-primary uppercase">Today</span>
<span class="font-headline-md text-headline-md text-primary">24</span>
<span class="font-label-md text-label-md text-primary">Oct</span>
</button>
<!-- Tomorrow -->
<button class="snap-start flex-shrink-0 w-[72px] h-[88px] rounded-xl flex flex-col items-center justify-center gap-1 border border-surface-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="font-label-md text-label-md uppercase">Tom</span>
<span class="font-headline-md text-headline-md text-on-surface">25</span>
<span class="font-label-md text-label-md">Oct</span>
</button>
<!-- Next Days -->
<button class="snap-start flex-shrink-0 w-[72px] h-[88px] rounded-xl flex flex-col items-center justify-center gap-1 border border-surface-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="font-label-md text-label-md uppercase">Wed</span>
<span class="font-headline-md text-headline-md text-on-surface">26</span>
<span class="font-label-md text-label-md">Oct</span>
</button>
<button class="snap-start flex-shrink-0 w-[72px] h-[88px] rounded-xl flex flex-col items-center justify-center gap-1 border border-surface-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="font-label-md text-label-md uppercase">Thu</span>
<span class="font-headline-md text-headline-md text-on-surface">27</span>
<span class="font-label-md text-label-md">Oct</span>
</button>
<button class="snap-start flex-shrink-0 w-[72px] h-[88px] rounded-xl flex flex-col items-center justify-center gap-1 border border-surface-variant bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-md text-label-md mt-1">More</span>
</button>
</div>
</section>

<!-- Hour -->
<div class="flex flex-col items-center">
<button class="h-10 w-16 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg transition-colors">
<span class="material-symbols-outlined" data-icon="expand_less">expand_less</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary bg-surface-container-low rounded-lg w-20 h-20 flex items-center justify-center border-b-2 border-primary">
                            08

<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>

</div>

</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface bg-surface-container-lowest rounded-lg w-20 h-20 flex items-center justify-center border border-surface-variant">

                        </div>
<button class="h-10 w-16 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg transition-colors">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</button>
</div>
</div>
</div>
</section>
