<style>
        .month-enter {
            opacity: 0;
            transform: translateX(10px);
        }
        .month-enter-active {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }
        .date-cell-active {
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1); }
            70% { box-shadow: 0 0 0 6px rgba(0, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Top App Bar (Suppressed as this is a focused task overlay) -->
<!-- Main Content Canvas (Calendar Overlay) -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-3xl shadow-[0_12px_48px_rgba(0,0,0,0.08)] overflow-hidden flex flex-col h-[600px] max-h-[795px]">
<!-- Header -->
<header class="flex items-center justify-between p-margin-main pb-stack-sm border-b border-surface-container">
<button aria-label="Close" class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Select Date</h1>
<div class="w-touch-target h-touch-target"></div> <!-- Balancer -->
</header>
<!-- Calendar Area -->
<div class="flex-1 overflow-y-auto p-margin-main flex flex-col gap-stack-lg">
<!-- Month Navigation -->
<div class="flex items-center justify-between">
<button class="h-10 w-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div class="flex flex-col items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">October</h2>
<span class="font-body-sm text-body-sm text-on-surface-variant">2023</span>
</div>
<button class="h-10 w-10 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Days of Week -->
<div class="grid grid-cols-7 gap-1 text-center mb-stack-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Su</span>
<span class="font-label-md text-label-md text-on-surface-variant">Mo</span>
<span class="font-label-md text-label-md text-on-surface-variant">Tu</span>
<span class="font-label-md text-label-md text-on-surface-variant">We</span>
<span class="font-label-md text-label-md text-on-surface-variant">Th</span>
<span class="font-label-md text-label-md text-on-surface-variant">Fr</span>
<span class="font-label-md text-label-md text-on-surface-variant">Sa</span>
</div>
<!-- Date Grid -->
<div class="grid grid-cols-7 gap-y-2 gap-x-1">
<!-- Empty slots for alignment -->
<div class="h-10 w-full"></div>
<div class="h-10 w-full"></div>
<div class="h-10 w-full"></div>
<!-- Past Dates (Disabled) -->
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-outline-variant opacity-50" disabled="">1</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-outline-variant opacity-50" disabled="">2</button>
<!-- Today (Available) -->
<button class="h-10 w-full flex flex-col items-center justify-center font-body-md text-body-md text-primary bg-surface-container-high rounded-lg hover:bg-surface-container-highest transition-colors relative">
<span class="font-bold">3</span>
<span class="absolute bottom-1 w-1 h-1 bg-secondary rounded-full"></span>
</button>
<!-- Available Dates -->
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">4</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors relative">
                    5
                    <!-- Popular Indicator -->
<span class="absolute top-1 right-1 w-1.5 h-1.5 bg-tertiary-container rounded-full"></span>
</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">6</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">7</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">8</button>
<!-- Selected Range Start (For visual variation, assuming user selected weekend) -->
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-primary bg-primary rounded-l-lg hover:bg-on-surface transition-colors z-10 shadow-sm">9</button>
<!-- Range Middle -->
<div class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-primary bg-surface-container-highest">10</div>
<!-- Range End -->
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-primary bg-primary rounded-r-lg hover:bg-on-surface transition-colors z-10 shadow-sm relative">
                    11
                    <div class="absolute inset-0 rounded-r-lg border-2 border-primary pointer-events-none"></div>
</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">12</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">13</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors relative">
                    14
                    <span class="absolute top-1 right-1 w-1.5 h-1.5 bg-tertiary-container rounded-full"></span>
</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">15</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">16</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">17</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">18</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">19</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">20</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">21</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">22</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">23</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">24</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">25</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">26</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">27</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">28</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">29</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">30</button>
<button class="h-10 w-full flex items-center justify-center font-body-md text-body-md text-on-surface hover:bg-surface-container-low rounded-lg transition-colors">31</button>
</div>
<!-- Legend / Context -->
<div class="flex items-center justify-center gap-stack-lg mt-auto pt-stack-md">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-md text-label-md text-on-surface-variant">Today</span>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary-container"></span>
<span class="font-label-md text-label-md text-on-surface-variant">High Demand</span>
</div>
</div>
</div>
<!-- Sticky Footer Action -->
<div class="p-margin-main bg-surface-container-lowest border-t border-surface-container">
<button class="w-full h-touch-target bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 hover:bg-on-surface transition-colors shadow-sm active:scale-[0.98]">
<span>Confirm Dates</span>
<span class="material-symbols-outlined text-[18px]">check</span>
</button>
</div>
</main>
<script>
        // Simple subtle entrance animation for the overlay
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            mainContent.style.opacity = '0';
            mainContent.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                mainContent.style.transition = 'opacity 400ms ease-out, transform 400ms cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
