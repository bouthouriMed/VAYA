<style>
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(248, 249, 255, 0.9) 0%, rgba(248, 249, 255, 0) 15%);
        }
        
        /* Pulse animation for the map pin shadow */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .pin-pulse::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        /* Smooth enter animation for bottom sheet */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden relative font-body-md select-none">
<!-- Interactive Map Background -->
<div class="absolute inset-0 z-0 bg-surface-container w-full h-[calc(100%-250px)]" data-location="Nabeul" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCmX8t088Y5cdH6Mn-L3nDtZw_JxltrB2AlSLrD-RGcfOJ-TLrF13XTPmndhIicUCPi2ovh4_axSo0mQYUGh_b8zYuEXuFAc309Y_k9qyYRzVJqr4nHFj2BhbeOAHFgvrgGYWXofdeQXBEO_sAjQxD1qaSGtRhEaTv2-m3_YOby6tfPokJfMA9ddkvIwDiNE2WYZxBx4b2HHgGSEdtGma6Ivwk8mclrSZtY11UiKSHmsA0-9VraZrda')">
<!-- Overlay to ensure top elements are legible -->
<div class="absolute inset-0 map-gradient-overlay pointer-events-none w-full h-full"></div>
</div>
<!-- Floating Top Nav (Task-Focused: Suppressed standard top bar, using minimal contextual controls) -->
<div class="absolute top-0 left-0 w-full z-20 pt-10 px-margin-main flex items-center justify-between pointer-events-none">
<button class="h-12 w-12 bg-surface-container-lowest rounded-full shadow-sm shadow-primary/10 flex items-center justify-center text-on-surface pointer-events-auto hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
</div>
<!-- Central Draggable Map Pin -->
<div class="absolute top-[35%] left-1/2 transform -translate-x-1/2 -translate-y-full z-10 flex flex-col items-center pointer-events-none">
<!-- Pin Body -->
<div class="relative flex flex-col items-center drop-shadow-md">
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center text-on-primary z-10">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<!-- Pin point -->
<div class="w-0 h-0 border-l-[8px] border-r-[8px] border-t-[12px] border-l-transparent border-r-transparent border-t-primary -mt-1 z-0"></div>
</div>
<!-- Shadow/Anchor point on map -->
<div class="relative w-4 h-1.5 bg-black/20 rounded-[50%] mt-1 pin-pulse"></div>
</div>
<!-- Foreground Bottom Sheet Context -->
<div class="absolute bottom-0 left-0 w-full z-30 flex flex-col bg-surface-container-lowest rounded-t-[24px] shadow-[0_-12px_40px_rgba(0,0,0,0.06)] animate-slide-up border-t border-outline-variant/10">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-outline-variant/40 rounded-full"></div>
</div>
<div class="px-margin-main flex flex-col gap-stack-lg pb-[32px]">
<!-- Header & Search Input -->
<div class="flex flex-col gap-stack-md">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Where to?</h1>
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center justify-center w-5 h-5">
<div class="w-2.5 h-2.5 rounded-sm bg-primary border-[1.5px] border-surface"></div>
</div>
<!-- Minimalist Input Field Design -->
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-12 pr-12 py-4 rounded-xl border border-transparent focus:bg-surface-container-lowest focus:border-primary/30 focus:shadow-[0_0_0_3px_rgba(0,0,0,0.05)] transition-all outline-none placeholder:text-on-surface-variant/60" placeholder="Enter drop-off location" type="text" value="Nabeul Bus Station">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface active:scale-90 transition-all opacity-0 group-focus-within:opacity-100">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Recommendations Section (Bento-lite list style) -->
<div class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase pl-1 mb-1">Recommended</h2>
<div class="flex flex-col gap-2">
<!-- Recommendation 1 -->
<button class="flex items-center gap-4 p-3 rounded-xl hover:bg-surface-container-low active:bg-surface-variant transition-colors border border-transparent hover:border-outline-variant/10 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
</div>
<div class="flex flex-col flex-1">
<span class="font-body-md text-body-md text-on-surface font-medium">Nabeul Bus Station</span>
<span class="font-label-md text-label-md text-on-surface-variant line-clamp-1">Avenue Habib Bourguiba, Nabeul</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-on-surface-variant transition-colors opacity-0 group-hover:opacity-100 text-[20px]">arrow_forward</span>
</button>
<!-- Recommendation 2 -->
<button class="flex items-center gap-4 p-3 rounded-xl hover:bg-surface-container-low active:bg-surface-variant transition-colors border border-transparent hover:border-outline-variant/10 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">schedule</span>
</div>
<div class="flex flex-col flex-1">
<span class="font-body-md text-body-md text-on-surface font-medium">Town Clock (Jar)</span>
<span class="font-label-md text-label-md text-on-surface-variant line-clamp-1">Centre Ville, Nabeul</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-on-surface-variant transition-colors opacity-0 group-hover:opacity-100 text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Primary Action Button Sticky Container -->
<div class="pt-2 w-full bg-surface-container-lowest">
<button class="w-full h-touch-target bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl flex items-center justify-center shadow-lg shadow-primary/15 hover:opacity-95 hover:shadow-primary/25 active:scale-[0.98] transition-all overflow-hidden relative">
<!-- Subtle shimmer effect -->
<div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full hover:animate-[shimmer_1.5s_infinite]"></div>
                    Confirm Drop-off
                </button>
</div>
</div>
</div>
<style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
<script>
        // Simple script to handle input clear behavior purely for visual feedback
        document.addEventListener('DOMContentLoaded', () => {
            const clearBtn = document.querySelector('.group button');
            const inputField = document.querySelector('input[type="text"]');
            
            if(clearBtn && inputField) {
                clearBtn.addEventListener('click', () => {
                    inputField.value = '';
                    inputField.focus();
                });
            }
        });
    </script>
</body></html>
