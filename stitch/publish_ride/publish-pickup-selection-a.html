<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Vaya - Select Pickup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c6c6cd",
                        "surface-container-low": "#eff4ff",
                        "on-background": "#0b1c30",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-container": "#e5eeff",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#6ffbbe",
                        "on-surface": "#0b1c30",
                        "on-primary-fixed": "#131b2e",
                        "surface-bright": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-error": "#ffffff",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "inverse-primary": "#bec6e0",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "secondary-container": "#6cf8bb",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#004395",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary-container": "#00714d",
                        "surface-dim": "#cbdbf5",
                        "surface-variant": "#d3e4fe",
                        "tertiary-fixed": "#d8e2ff",
                        "on-primary-container": "#7c839b",
                        "on-tertiary-fixed": "#001a42",
                        "surface-tint": "#565e74",
                        "outline": "#76777d",
                        "inverse-surface": "#213145",
                        "on-secondary-fixed": "#002113",
                        "primary-container": "#131b2e",
                        "on-tertiary-container": "#3980f4",
                        "on-secondary-fixed-variant": "#005236",
                        "secondary": "#006c49",
                        "primary": "#000000",
                        "tertiary-container": "#001a42",
                        "error": "#ba1a1a",
                        "tertiary": "#000000",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-fixed-dim": "#4edea3",
                        "on-surface-variant": "#45464d",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-grid": "16px",
                        "touch-target": "48px",
                        "margin-main": "20px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .map-pin-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(2); opacity: 0; }
        }
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-container-lowest shadow-sm shadow-primary/10 flex items-center justify-between px-margin-main h-touch-target">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container transition-colors active:scale-95 text-on-surface-variant dark:text-outline">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed">Set Pickup</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Map Canvas -->
<main class="relative flex-1 w-full bg-surface-container-low mt-[48px]">
<!-- Map Background -->
<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A clean, modern, minimalist city map centered on a bustling urban area like Tunis. The map uses a light-mode color palette with soft whites, pale grays, and subtle slate blues for water bodies. Roads are rendered as clean, high-contrast white lines against very light gray blocks, ensuring maximum clarity and minimal visual noise, perfectly suited for a premium ride-hailing interface." data-location="Tunis" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD6srWozyTXbmU2HQq54xVWTOflSbBkjCdGlNi2XkrumqWNTn67-4aeNLalJsMZuVGmeXDUEDtisaLRFaBsG1HfWPkFlqAeK6YcvbzbrOKTMR5MlXnGDClyWe10QB8cQsrst3FQic0MZtMvvQ_71vlt888lH5bS3JOqkxxQNcm2-wj_2Frg6z5p2pUglWvJetlt6mZNhcM283hHsnpPTE8StJ6Tg9IC6RrT4apeKVSgBDEelf81VXNk')"></div>
<!-- Central Pin & Interaction Cues -->
<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-32">
<!-- Info Bubble -->
<div class="bg-surface-container-lowest text-on-surface font-label-lg text-label-lg px-4 py-2 rounded-full shadow-lg mb-4 flex items-center gap-2 transform -translate-y-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
                Searching nearby...
            </div>
<!-- Pin -->
<div class="relative flex items-center justify-center">
<div class="absolute w-12 h-12 bg-primary/20 rounded-full map-pin-pulse"></div>
<div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center shadow-xl z-10">
<div class="w-3 h-3 bg-surface-container-lowest rounded-full"></div>
</div>
<div class="absolute -bottom-6 w-1 h-8 bg-primary/80 rounded-full z-0 origin-bottom"></div>
</div>
<!-- Drag Hint -->
<div class="mt-8 text-on-surface-variant bg-surface-container-lowest/80 backdrop-blur px-3 py-1 rounded-full font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="pan_tool">pan_tool</span>
                Drag map to move
            </div>
</div>
<!-- Current Location FAB -->
<button aria-label="My Location" class="absolute bottom-[340px] right-margin-main w-12 h-12 bg-surface-container-lowest text-primary rounded-full shadow-lg shadow-primary/10 flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all z-20">
<span class="material-symbols-outlined" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</main>
<!-- Bottom Sheet: Recommendations & Confirm -->
<section class="bottom-sheet absolute bottom-0 w-full bg-surface-container-lowest rounded-t-[16px] shadow-[0_-8px_24px_rgba(0,0,0,0.08)] z-40 flex flex-col">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<div class="px-margin-main pb-stack-lg pt-stack-sm flex flex-col gap-stack-md">
<!-- Header -->
<div class="flex flex-col gap-1">
<h2 class="font-headline-md text-headline-md text-primary">Confirm your pickup</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Drag the map or select a recommended spot.</p>
</div>
<!-- Address Input Field (Read-only representation) -->
<div class="w-full border border-outline-variant rounded-lg p-3 flex items-center gap-3 bg-surface-bright">
<div class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined text-[20px]" data-icon="search">search</span>
</div>
<div class="flex-1 overflow-hidden">
<p class="font-body-md text-body-md text-on-surface truncate">Avenue Habib Bourguiba</p>
</div>
<button class="text-primary font-label-md text-label-md uppercase tracking-wider px-2">Edit</button>
</div>
<!-- Recommended Spots List -->
<div class="flex flex-col gap-2 mt-2">
<p class="font-label-md text-label-md text-outline uppercase tracking-wider mb-1">Recommended</p>
<!-- Spot 1 -->
<button class="flex items-center gap-4 w-full p-2 rounded-lg hover:bg-surface-container-low active:bg-surface-container transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="corporate_fare">corporate_fare</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-medium">Vaya HQ Main Entrance</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Safe &amp; convenient</span>
</div>
</button>
<!-- Spot 2 -->
<button class="flex items-center gap-4 w-full p-2 rounded-lg hover:bg-surface-container-low active:bg-surface-container transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="train">train</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-medium">Tunis Main Station</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">North Entrance, Taxi Rank</span>
</div>
</button>
</div>
<!-- Confirm CTA -->
<button class="w-full h-touch-target mt-4 bg-primary text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all shadow-md shadow-primary/20">
                Confirm Pickup
            </button>
</div>
</section>
</body></html>
