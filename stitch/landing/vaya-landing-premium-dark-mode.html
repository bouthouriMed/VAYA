<div class="relative z-10 flex-1 flex flex-col justify-between px-margin-main pb-safe pt-12">

<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-secondary tracking-wider uppercase font-extrabold glow-text">

<div class="text-center mb-4">
<h2 class="font-headline-md text-headline-md text-on-secondary mb-2">Elevate Your Journey.</h2>
<p class="font-body-md text-body-md text-primary-fixed-dim">Experience seamless, premium mobility at your fingertips.</p>

<div class="bg-glass rounded-xl p-stack-lg flex flex-col gap-stack-md shadow-2xl">
<button class="w-full h-touch-target flex items-center justify-center gap-3 bg-surface-container-lowest/10 hover:bg-surface-container-lowest/20 transition-colors border border-outline/30 rounded-lg text-on-secondary font-label-lg text-label-lg active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-secondary">login</span>
                    Continue with Google
                </button>
<button class="w-full h-touch-target flex items-center justify-center gap-3 bg-surface-container-lowest/10 hover:bg-surface-container-lowest/20 transition-colors border border-outline/30 rounded-lg text-on-secondary font-label-lg text-label-lg active:scale-95 duration-150">

                </button>

                    Sign In with Email
                </button>
</div>
<div class="text-center mt-4">
<p class="font-body-sm text-body-sm text-primary-fixed-dim">
                    New to Vaya? <a class="text-secondary-fixed-dim font-medium hover:underline underline-offset-4 transition-all" href="#">Create an account</a>
</p>
</div>
</main>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-fade-in-up');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = `opacity 0.6s ease-out ${index * 0.15}s, transform 0.6s ease-out ${index * 0.15}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 50);
            });
        });
    </script>
