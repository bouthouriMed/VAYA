packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/*'

overrides:
  react: 19.1.0
  react-dom: 19.1.0
  metro: 0.87.0
  metro-babel-transformer: 0.87.0
  metro-cache: 0.87.0
  metro-cache-key: 0.87.0
  metro-config: 0.87.0
  metro-core: 0.87.0
  metro-file-map: 0.87.0
  metro-minify-terser: 0.87.0
  metro-resolver: 0.87.0
  metro-runtime: 0.87.0
  metro-source-map: 0.87.0
  metro-symbolicate: 0.87.0
  metro-transform-plugins: 0.87.0
  metro-transform-worker: 0.87.0
  # Security overrides (2026-09-21 security sprint, docs/security/): force
  # patched versions of transitive dependencies with published advisories
  # that the direct dependency has not yet bumped past.
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'fast-uri@>=4.0.0 <4.1.3': 4.1.3
  '@fastify/static@<10.1.2': 10.1.4
  'postcss@<8.5.23': 8.5.23

