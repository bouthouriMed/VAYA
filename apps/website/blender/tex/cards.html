<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1000px;height:630px;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
.card{position:absolute;inset:0;border-radius:0;padding:56px 60px;color:#F6F1E7;
 background:radial-gradient(120% 90% at 0% 0%,#24463A 0%,#16211C 55%,#0D1512 100%)}
.card.b{background:radial-gradient(120% 90% at 100% 0%,#2E4A5A 0%,#18252C 55%,#0E1519 100%)}
.card.c{background:radial-gradient(120% 90% at 50% 0%,#4A4030 0%,#231F18 55%,#141210 100%)}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Georgia,serif;font-size:40px;letter-spacing:.18em;font-weight:600}
.tag{font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#7FF0BA;border:2px solid rgba(127,240,186,.5);padding:8px 18px;border-radius:40px}
h2{font-family:Georgia,serif;font-weight:500;font-size:56px;margin-top:70px}
.row{display:flex;gap:40px;margin-top:40px;align-items:center}
.ph{width:170px;height:200px;border-radius:26px;background:linear-gradient(160deg,#3a5a4c,#1b2b24);position:relative;overflow:hidden}
.ph:before{content:'';position:absolute;width:76px;height:76px;border-radius:50%;background:#8FB8A5;left:47px;top:38px;opacity:.85}
.ph:after{content:'';position:absolute;width:140px;height:110px;border-radius:70px 70px 0 0;background:#8FB8A5;left:15px;top:128px;opacity:.85}
.lines div{height:18px;border-radius:9px;background:rgba(246,241,231,.22);margin:18px 0}
.chip{width:110px;height:82px;border-radius:16px;background:linear-gradient(135deg,#E9D8A6,#B8975A);position:absolute;right:64px;bottom:60px}
.plate{margin-top:60px;display:inline-block;background:#F6F1E7;color:#141210;border-radius:14px;padding:20px 34px;font-size:64px;font-weight:700;letter-spacing:.08em}
.plate span{font-family:'Segoe UI';font-size:40px;margin:0 16px;opacity:.7}
</style></head><body>
<div class="card" id="id"><div class="top"><div class="brand">VAYA</div><div class="tag">✓ Selfie en direct</div></div>
<div class="row"><div class="ph"></div><div class="lines" style="flex:1"><div style="width:80%"></div><div style="width:60%"></div><div style="width:70%"></div><div style="width:40%"></div></div></div>
<div class="chip"></div></div>
</body></html>
