# Fly.io app config for the BullMQ background worker (docker/worker.Dockerfile).
# No HTTP service — this process only consumes queue jobs, it doesn't serve
# requests, so there's deliberately no [http_service]/[[services]] block.
#
# Deploy with:
#   fly apps create <your-unique-worker-app-name>   # once, to claim the name
#   fly deploy -c fly.worker.toml -a <your-unique-worker-app-name>
#
# "app" below is a placeholder, same as fly.api.toml — must be globally
# unique, and does NOT need to match the api app's name (they're two
# independent Fly apps, matching the two independent Docker images).
app = "vaya-worker"

primary_region = "cdg"

[build]
  dockerfile = "docker/worker.Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
