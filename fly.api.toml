# Fly.io app config for the Fastify API (docker/api.Dockerfile).
#
# Deploy with:
#   fly apps create <your-unique-app-name>   # once, to claim the name
#   fly deploy -c fly.api.toml -a <your-unique-app-name>
#
# "app" below is a placeholder — Fly app names are globally unique across
# every Fly account, so replace it with your own before running `fly apps
# create`, or pass -a <name> on every fly command to override it without
# editing this file.
app = "vaya-api"

# Paris — closest common Fly region to Tunisia. Change if you know a closer
# one is available on your account tier.
primary_region = "cdg"

[build]
  dockerfile = "docker/api.Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Keeping at least one machine running avoids the "cold start" delay a
  # scale-to-zero config would introduce — acceptable to lower to 0 later if
  # the free allowance needs stretching further and occasional cold starts
  # are fine for your launch traffic.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
